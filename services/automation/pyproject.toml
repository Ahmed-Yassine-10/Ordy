[project]
name = "ordy-sandbox"
version = "0.1.0"
description = "Ordy automation sandbox — hardened Playwright runner for verified browser workflows."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
    "ordy-automation",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_sandbox"]

[tool.uv.sources]
ordy-core = { workspace = true }
ordy-automation = { workspace = true }
