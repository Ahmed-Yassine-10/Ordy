[project]
name = "ordy-voice"
version = "0.1.0"
description = "Ordy voice gateway — LiveKit agent workers, dual pipeline (realtime / modular STT-TTS)."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
    "ordy-agent",
    "pydantic-settings>=2.3",
]

# Audio transport + STT/TTS vendors are optional so the pure parts (pipeline selection,
# menu-derived lexicon compilation) import + test without the heavy stack. Vendors are
# chosen by the Phase 5 Derja benchmark spike (doc 05 §6) before being pinned here.
[project.optional-dependencies]
livekit = ["livekit-agents>=0.10"]
stt = ["deepgram-sdk>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_voice"]
