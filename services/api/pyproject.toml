[project]
name = "ordy-api"
version = "0.1.0"
description = "Ordy core API — REST + agent orchestration (modular monolith, doc 01 §4.2)."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
    "ordy-security",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",     # sync driver for Alembic migrations
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_api"]
