[project]
name = "ordy-api"
version = "0.1.0"
description = "Ordy core API — REST + agent orchestration (modular monolith, doc 01 §4.2)."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
    "ordy-security",
    "ordy-ingest[crawl]",       # pipeline + inline-dev fetching (httpx)
    "ordy-rag",                 # chunking, embeddings, hybrid retrieval
    "ordy-tools",               # action gate: ToolSpecs, policy engine, executors
    "ordy-orders",              # order domain: state machine, hours, zones, totals
    "ordy-agent",               # conversational agent orchestrator
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",     # sync driver for Alembic migrations
    "celery[redis]>=5.4",       # enqueue ingestion runs to the worker
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
ordy-core = { workspace = true }
ordy-security = { workspace = true }
ordy-ingest = { workspace = true }
ordy-rag = { workspace = true }
ordy-tools = { workspace = true }
ordy-orders = { workspace = true }
ordy-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_api"]
