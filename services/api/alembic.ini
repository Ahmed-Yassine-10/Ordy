[alembic]
script_location = alembic
prepend_sys_path = src
# Real URL comes from the DATABASE_MIGRATION_URL env var (see alembic/env.py).
# This placeholder is only used if that variable is unset.
sqlalchemy.url = postgresql+psycopg://ordy_migrator:ordy_migrator_pw@localhost:5432/ordy

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
