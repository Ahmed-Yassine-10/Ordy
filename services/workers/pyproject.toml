[project]
name = "ordy-workers"
version = "0.1.0"
description = "Ordy background workers — ingestion, embeddings, webhooks, schedules (Celery)."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
    "ordy-ingest[crawl]",
    "ordy-security",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_workers"]
