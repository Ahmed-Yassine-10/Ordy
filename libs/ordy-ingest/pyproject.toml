[project]
name = "ordy-ingest"
version = "0.1.0"
description = "Ordy restaurant-intelligence pipeline: fetch, extract, analyze, synthesize, diff."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
]

# Real crawling/extraction backends are optional so the pure pipeline (JSON-LD
# extraction, OpenAPI analysis, synthesis, diff) stays importable + testable with
# only the standard library.
[project.optional-dependencies]
crawl = ["playwright>=1.45", "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_ingest"]
