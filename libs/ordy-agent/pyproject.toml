[project]
name = "ordy-agent"
version = "0.1.0"
description = "Ordy agent orchestrator — conversation state, the role nodes, model router, grounding."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
    "ordy-rag",
    "ordy-tools",
]

# The LangGraph runtime (durable checkpointing + interrupts, primary from Phase 6) and
# real LLM providers are optional. The node logic + the sequential engine used for the
# Phase 5 read-only flow are pure and run without them (deterministic RuleBasedBrain).
[project.optional-dependencies]
graph = ["langgraph>=0.2"]
openai = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_agent"]

[tool.uv.sources]
ordy-core = { workspace = true }
ordy-rag = { workspace = true }
ordy-tools = { workspace = true }
