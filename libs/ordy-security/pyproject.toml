[project]
name = "ordy-security"
version = "0.1.0"
description = "Ordy security primitives: password hashing, JWT, API-key generation/verification."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_security"]
