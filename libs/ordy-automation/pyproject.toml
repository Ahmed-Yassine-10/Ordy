[project]
name = "ordy-automation"
version = "0.1.0"
description = "Ordy browser automation — workflow model, safety guards, deterministic runner, drift tracking."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
]

# Playwright lives in the sandbox service, behind the BrowserDriver port, so the
# workflow logic + safety guards stay testable with only the standard library.
[project.optional-dependencies]
playwright = ["playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_automation"]

[tool.uv.sources]
ordy-core = { workspace = true }
