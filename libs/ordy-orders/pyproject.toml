[project]
name = "ordy-orders"
version = "0.1.0"
description = "Ordy order domain — status machines, operating hours, delivery zones, totals."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_orders"]

[tool.uv.sources]
ordy-core = { workspace = true }
