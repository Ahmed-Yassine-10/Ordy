[project]
name = "ordy-tools"
version = "0.1.0"
description = "Ordy action gate — ToolSpecs, policy engine, server-side pricing, confirmation, executors."
requires-python = ">=3.12"
dependencies = [
    "ordy-core",
]

# Full JSON Schema coverage in production comes from the `jsonschema` library behind the
# SchemaValidator port; the built-in BasicSchemaValidator covers the catalog's constructs
# and keeps the gate testable with only the standard library.
[project.optional-dependencies]
jsonschema = ["jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_tools"]
