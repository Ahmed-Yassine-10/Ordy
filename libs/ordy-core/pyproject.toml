[project]
name = "ordy-core"
version = "0.1.0"
description = "Ordy shared domain: models, DB base, tenant-context/RLS session, money/time/id utils, errors."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordy_core"]
