name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend — lint, unit, RLS isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ordy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync workspace
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Provision roles + extensions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d ordy -f infra/docker/initdb/01-roles.sql
      - name: Migrate
        working-directory: services/api
        env:
          DATABASE_MIGRATION_URL: postgresql+psycopg://ordy_migrator:ordy_migrator_pw@localhost:5432/ordy
        run: uv run alembic upgrade head
      - name: Unit + isolation tests
        env:
          DATABASE_URL: postgresql+asyncpg://ordy_app:ordy_app_pw@localhost:5432/ordy
        run: uv run pytest -q

  web:
    name: web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ordy/web typecheck
      - run: pnpm --filter @ordy/web build
