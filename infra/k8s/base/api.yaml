apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordy-api
  labels: { app: ordy-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: ordy-api } }
  template:
    metadata:
      labels: { app: ordy-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/ordy/api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: ordy-secrets }
            - configMapRef: { name: ordy-config }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: ordy-api
spec:
  selector: { app: ordy-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ordy-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ordy-api }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ordy-api
spec:
  minAvailable: 1
  selector: { matchLabels: { app: ordy-api } }
