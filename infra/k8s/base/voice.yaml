# Voice workers hold long-lived audio sessions, so they scale on ACTIVE SESSIONS rather
# than CPU and drain slowly — killing a pod mid-call drops a customer (doc 01 §6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordy-voice
  labels: { app: ordy-voice }
spec:
  replicas: 2
  selector: { matchLabels: { app: ordy-voice } }
  template:
    metadata:
      labels: { app: ordy-voice }
    spec:
      terminationGracePeriodSeconds: 600
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: voice
          image: ghcr.io/ordy/voice:latest
          envFrom:
            - secretRef: { name: ordy-secrets }
            - configMapRef: { name: ordy-config }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "ordy-voice drain --wait"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ordy-voice
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ordy-voice }
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric: { name: ordy_active_voice_sessions }
        target: { type: AverageValue, averageValue: "8" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
