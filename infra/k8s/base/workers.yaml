apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordy-workers
  labels: { app: ordy-workers }
spec:
  replicas: 2
  selector: { matchLabels: { app: ordy-workers } }
  template:
    metadata:
      labels: { app: ordy-workers }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: worker
          image: ghcr.io/ordy/workers:latest
          envFrom:
            - secretRef: { name: ordy-secrets }
            - configMapRef: { name: ordy-config }
          resources:
            requests: { cpu: 300m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ordy-workers
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ordy-workers }
  minReplicas: 1
  maxReplicas: 15
  metrics:
    - type: External
      external:
        metric: { name: celery_queue_depth }
        target: { type: AverageValue, averageValue: "20" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordy-beat
spec:
  replicas: 1  # exactly one scheduler
  selector: { matchLabels: { app: ordy-beat } }
  template:
    metadata:
      labels: { app: ordy-beat }
    spec:
      containers:
        - name: beat
          image: ghcr.io/ordy/workers:latest
          command: ["celery", "-A", "ordy_workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
          envFrom:
            - secretRef: { name: ordy-secrets }
            - configMapRef: { name: ordy-config }
