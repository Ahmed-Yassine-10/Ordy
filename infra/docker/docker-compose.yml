# Local dev stack for Ordy. From repo root:  docker compose -f infra/docker/docker-compose.yml up
# (a root-level docker-compose.yml symlink/wrapper is provided for convenience)
name: ordy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ordy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # creates ordy_app + ordy_migrator roles
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # LiveKit dev server — only needed from Phase 5. Start with:  --profile voice
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["voice"]
    command: ["--dev", "--bind", "0.0.0.0"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../../.env
    environment:
      # Inside the compose network, hostnames replace localhost.
      DATABASE_URL: postgresql+asyncpg://ordy_app:ordy_app_pw@postgres:5432/ordy
      DATABASE_MIGRATION_URL: postgresql+psycopg://ordy_migrator:ordy_migrator_pw@postgres:5432/ordy
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../../services/api/src:/app/services/api/src   # hot reload
      - ../../libs:/app/libs
    command: ["uvicorn", "ordy_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
  redisdata:
  miniodata:
